storage:
  dbPath: /var/lib/unifi-mongodb
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25
systemLog:
  destination: file
  path: /var/log/unifi-mongodb/mongod.log
  logAppend: true
net:
  bindIp: 127.0.0.1
  port: 27017
security:
  authorization: enabled
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
